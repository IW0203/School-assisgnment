<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f0f0f0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        
        ul {
            list-style: none;
        }

        nav {
            background-color: #fff;
            box-shadow: 0 5px 4px rgba(0,0,0,0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .navbar-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #757575;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .nav-item {
            padding: 0.5rem 1rem;
        }
        
        .nav-item:hover {
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        
        .nav-link {
            font-weight: 700;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .intro {
            display: flex;
            flex-direction: column;
            background: #e74c3c;
            color: #efefef;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .intro h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .intro p {
            font-size: 1.1rem;
        }

        .suggestions-form {
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .form-group input,
        .form-group textarea {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            background: #e74c3c;
            color: #fff;
            padding: 1rem;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            margin-top: 20px;
        }

        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="navbar-logo">
            <a href="index.html">MovieBlog</a>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="popular.html">Populars</a></li>
            <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
            <li class="nav-item"><a class="nav-link" href="upcoming.html">Upcoming</a></li>
            <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
            <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
            <li class="nav-item"><a class="nav-link" href="suggestions.html">Suggestions</a></li>
            <li class="nav-item"><a class="nav-link" href="awards.html">Award Winnigs</a></li>
        </ul>
    </nav>

    <main>
        <section class="intro">
            <h1>Site Suggestions</h1>
            <p>Help us improve! Share your ideas and feedback.</p>
        </section>

        <section class="suggestions-form">
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="suggestion">Your Suggestion</label>
                    <textarea id="suggestion" name="suggestion" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Get your snacks and drinks ready and enjoy watching.</p>
    </footer>
    
</body>
</html>
